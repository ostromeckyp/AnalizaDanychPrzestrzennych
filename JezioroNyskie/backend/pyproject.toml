[project]
name = "mielizna-api"
version = "0.1.0"
description = "Backend FastAPI serwujący produkty pipeline'u Mielizna (Jezioro Nyskie)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mielizna",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "pillow",
    "pyproj",
    "geopandas",
    "shapely",
    "pyogrio",
    "affine",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.uv.sources]
mielizna = { path = "../pipeline", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real: wymaga data/processed/model/all/"]
