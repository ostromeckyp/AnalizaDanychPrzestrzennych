# Konfiguracja pipeline'u Mielizna (Jezioro Nyskie)
bbox_wgs84: [17.20, 50.425, 17.32, 50.485]  # lon_min, lat_min, lon_max, lat_max

grid:
  crs: "EPSG:2180"
  xmin: 372000
  ymin: 285500
  xmax: 381000
  ymax: 292500
  res: 10

period:
  start: "2017-01-01"
  end: "2026-12-31"

scene_filter:
  max_tile_cloud: 60
  max_local_cloud_pct: 5
  min_valid_pct: 95
  max_ice_pct: 1
  buffer_m: 500
  exclude_dates:
    - {date: "2017-02-27", reason: "ice sheet over eastern and central lake (cracked ice texture), open water only in west"}
    - {date: "2019-02-15", reason: "ice sheet on eastern basin and along south/east shoreline"}
    - {date: "2019-02-17", reason: "ice sheet on eastern basin and ice rim along south/east shoreline"}
    - {date: "2021-03-03", reason: "drifting ice floes in east and broken ice along south and west shorelines"}
    - {date: "2021-12-03", reason: "uncertain: sharp-edged pale sheet in SW basin and pale rim on south shore, possible thin ice"}
    - {date: "2022-01-15", reason: "bright ice rim along SE shoreline"}
    - {date: "2023-02-09", reason: "brash ice / floe streaks across the whole lake incl. north shore"}
    - {date: "2023-12-18", reason: "white snow/ice patches on SW and E shoreline at waterline"}
    - {date: "2024-09-01", reason: "corrupt L2A: red/nir/swir16/swir22 all DN=1, striped blue; check_radiometry p99=0.0001"}
    - {date: "2025-01-19", reason: "uncertain: white patches in southern marsh inlets at shoreline, possible ice/snow"}
    - {date: "2025-12-12", reason: "uncertain: textured pale patch with small bright floes near south shore, possible thin ice"}
    - {date: "2026-02-28", reason: "lake mostly ice-covered (east and centre), open water only in west"}
    - {date: "2026-03-02", reason: "lake mostly ice-covered (east and centre)"}
    - {date: "2026-03-05", reason: "residual ice sheet over eastern half and NE shore"}
    - {date: "2026-03-07", reason: "residual ice floes in NE basin near the dam shore"}

periods:
  all: ["2017-01-01", "2026-12-31"]
  pre_flood: ["2017-01-01", "2024-08-31"]
  post_flood: ["2024-09-30", "2026-12-31"]

# ścieżki względem JezioroNyskie/data
paths:
  raw: "raw"
  processed: "processed"
  reference: "reference"

# LiDAR i NMT z GUGiK (krok 02). WFS: skorowidze arkuszy (warstwy roczne `gugik:Skorowidz...<rok>`).
lidar:
  epochs: [2011, 2017, 2022, 2024]
  wfs:
    laz_evrf: "https://mapy.geoportal.gov.pl/wss/service/PZGIK/DanePomiaroweLidarEVRF2007/WFS/Skorowidze"
    laz_kron: "https://mapy.geoportal.gov.pl/wss/service/PZGIK/DanePomiaroweLidarKRON86/WFS/Skorowidze"
    nmt_evrf: "https://mapy.geoportal.gov.pl/wss/service/PZGIK/NumerycznyModelTerenuEVRF2007/WFS/Skorowidze"
    nmt_kron: "https://mapy.geoportal.gov.pl/wss/service/PZGIK/NumerycznyModelTerenuKRON86/WFS/Skorowidze"
  layer_prefix: {laz: "gugik:SkorowidzDanychPomiarowychLIDAR", nmt: "gugik:SkorowidzNMT"}
  page_size: 100
  shore_band_m: 300          # NMT: pierścień lake.boundary.buffer(shore_band_m)
  laz_sheets_per_epoch: 4    # LAZ: tyle arkuszy na epokę (najwięcej wody, po jednym na ćwiartkę)
  max_download_gb: 15        # powyżej: skrypt zatrzymuje się po dry-run

# Mapa KŻ (krok 09)
kz:
  # Kolory zmierzone na data/raw/kz/kz_full.png (wycinki legendy i linii oglądane Read, średnie RGB szkieletu linii
  # i wypełnień; patrz uzasadnienie w mielizna/kz.py, sekcja „Poziomice”). Wszystkie poziomice mają TEN SAM granat,
  # więc poziom wynika z sąsiedniego wypełnienia: pas 192,5-195,0 m biały, głębiej błękit, ląd zielony/beżowy.
  contour_colors:
    line: [40, 60, 170]        # granat do średniego błękitu linii (rdzeń 15,30,140; antyaliasing i cienkie linie 60-110,70-130,170-210)
    line_tol: 90               # Czebyszew; nie łapie błękitu wody (g >= 195) ani czerni (b < 80)
    shallow: [248, 251, 253]   # biały pas 192,5-195,0 m (próbki 236,243,251 do 255,255,255)
    shallow_tol: 14
    deep: [195, 235, 250]      # błękit głębszej wody (próbki 217,248,250; 201,216,235)
    deep_tol: 35
    ring_px: 8                 # promień sąsiedztwa do wykrycia wypełnień obok linii
    grow_px: 10                # ile pikseli ziarno może rosnąć po granatowej masce (zasklepia przerwy w cienkich liniach)
  contour_min_len_px: 80       # krótsze (kreski linii „orientacyjnych”, litery) odpadają
  # Fragmenty ewidentnie błędne po klasyfikacji: wpis = środek linii (EPSG:2180) i długość; dopasowanie do 20 m (stabilne
  # wobec zmiany numeracji). Każdy wpis ma `reason` obejrzany na wycinku mapy.
  contour_drop:
    - {x: 374164, y: 287866, length_m: 176, reason: "pętla wokół wzgórka 198,7 m: druga poziomica na zewnątrz, więc to poziom > 195,0 (uwaga recenzenta + oględziny wycinka)"}
  side_offset_px: 8            # odległość próbkowania stron linii (klasa: woda / ląd)
  shore_vote_min: 0.5          # 195,0: min. udział próbek „ląd z jednej strony, woda z drugiej”
  parallel_tol_m: 12           # pary równoległych poziomic 195: zostaje ta bliżej brzegu jeziora
