[project]
name = "mielizna"
version = "0.1.0"
description = "Pipeline budujący model dna Jeziora Nyskiego z obrazów Sentinel-2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pystac-client",
    "odc-stac",
    "rasterio",
    "rioxarray",
    "xarray",
    "geopandas",
    "shapely",
    "pyogrio",
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "joblib",
    "pypdf",
    "requests",
    "pyyaml",
    "affine",
    "matplotlib",
    "laspy[lazrs]>=2.7.0",
    "pyproj>=3.8.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mielizna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning:odc", "ignore::DeprecationWarning:odc"]
