# Mielizna: `docker compose up --build` -> http://localhost:8080
# Zmienne (np. MIELIZNA_LIVE=0) można podać w pliku `.env` obok tego pliku.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MIELIZNA_DATA_DIR: /data
      MIELIZNA_CURRENT_DIR: /cache/current   # poza /data (tylko do odczytu); wolumen niżej
      MIELIZNA_LIVE: ${MIELIZNA_LIVE:-1}     # 0 wyłącza odświeżanie poziomu z sieci
    volumes:
      - ./data/processed:/data/processed:ro
      - ./data/reference:/data/reference:ro
      - current-cache:/cache
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  current-cache:
