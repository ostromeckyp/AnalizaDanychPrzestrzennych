<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Mapa jeziora</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100%; min-height: 200px; overflow: hidden; background: {{c.land}}; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block" role="img" aria-label="Mapa Jeziora Nyskiego ze strefami głębokości">
<defs>
<pattern id="lm-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="9" height="9" fill="{{c.risk}}"></rect>
<line x1="0" y1="0" x2="0" y2="9" stroke="{{c.hatch}}" stroke-width="3"></line>
</pattern>
<pattern id="lm-dots" width="10" height="10" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.4" fill="{{c.dots}}"></circle>
<circle cx="7" cy="7" r="1.4" fill="{{c.dots}}"></circle>
</pattern>
<clipPath id="lm-lake">
<path d="M 140 360 C 150 300, 210 260, 280 250 C 340 242, 380 210, 440 200 C 520 188, 560 220, 630 215 C 700 210, 740 180, 810 185 C 880 190, 930 230, 990 240 L 1052 250 L 1060 470 C 1000 480, 950 500, 890 505 C 820 512, 780 540, 710 545 C 640 550, 600 520, 540 525 C 470 530, 430 560, 360 548 C 300 538, 270 500, 220 490 C 170 480, 135 430, 140 360 Z"></path>
</clipPath>
</defs>

<g aria-hidden="true">
<path d="M -20 120 L 260 80 L 300 170 L 40 210 Z" fill="{{c.field}}"></path>
<path d="M 480 40 L 760 30 L 770 140 L 470 150 Z" fill="{{c.forest}}"></path>
<path d="M 860 60 L 1150 90 L 1130 190 L 870 150 Z" fill="{{c.field}}"></path>
<path d="M 120 590 L 420 600 L 410 700 L 90 700 Z" fill="{{c.forest}}"></path>
<path d="M 560 610 L 820 590 L 860 700 L 560 700 Z" fill="{{c.field}}"></path>
<path d="M 1080 520 L 1200 500 L 1200 700 L 1060 700 Z" fill="{{c.town}}"></path>
<path d="M 1110 540 h 30 v 22 h -30 Z M 1150 560 h 26 v 30 h -26 Z M 1100 590 h 40 v 24 h -40 Z M 1160 610 h 30 v 28 h -30 Z" fill="{{c.building}}"></path>
<path d="M -10 250 C 120 230, 180 190, 300 150 C 420 110, 640 160, 820 150 C 980 140, 1080 200, 1210 230" fill="none" stroke="{{c.roadEdge}}" stroke-width="7"></path>
<path d="M -10 250 C 120 230, 180 190, 300 150 C 420 110, 640 160, 820 150 C 980 140, 1080 200, 1210 230" fill="none" stroke="{{c.road}}" stroke-width="4"></path>
<path d="M -10 610 C 200 580, 380 590, 560 580 C 760 570, 960 560, 1210 600" fill="none" stroke="{{c.roadEdge}}" stroke-width="7"></path>
<path d="M -10 610 C 200 580, 380 590, 560 580 C 760 570, 960 560, 1210 600" fill="none" stroke="{{c.road}}" stroke-width="4"></path>
<path d="M 0 382 C 50 378, 100 372, 145 362" fill="none" stroke="{{c.river}}" stroke-width="9" stroke-linecap="round"></path>
<path d="M 1058 400 C 1100 410, 1140 440, 1210 448" fill="none" stroke="{{c.river}}" stroke-width="9" stroke-linecap="round"></path>
</g>

<path d="M 140 360 C 150 300, 210 260, 280 250 C 340 242, 380 210, 440 200 C 520 188, 560 220, 630 215 C 700 210, 740 180, 810 185 C 880 190, 930 230, 990 240 L 1052 250 L 1060 470 C 1000 480, 950 500, 890 505 C 820 512, 780 540, 710 545 C 640 550, 600 520, 540 525 C 470 530, 430 560, 360 548 C 300 538, 270 500, 220 490 C 170 480, 135 430, 140 360 Z" fill="{{c.water}}"></path>

<g clip-path="url(#lm-lake)" display="{{bathyDisplay}}" aria-hidden="true">
<rect x="0" y="0" width="1200" height="700" fill="{{c.b1}}"></rect>
<path d="M 230 340 C 300 270, 420 245, 520 240 C 640 236, 760 210, 880 228 C 960 240, 1010 258, 1052 262 L 1058 460 C 960 476, 880 488, 780 500 C 680 512, 560 505, 440 515 C 340 520, 250 470, 230 340 Z" fill="{{c.b2}}"></path>
<path d="M 330 340 C 390 290, 500 275, 610 280 C 720 282, 820 250, 920 270 C 980 282, 1020 290, 1050 292 L 1056 440 C 960 455, 870 465, 780 470 C 680 476, 560 480, 450 478 C 370 470, 310 400, 330 340 Z" fill="{{c.b3}}"></path>
<path d="M 480 345 C 560 310, 680 310, 780 300 C 870 292, 960 305, 1050 318 L 1054 420 C 960 430, 860 438, 760 440 C 660 442, 560 440, 500 420 C 460 400, 450 362, 480 345 Z" fill="{{c.b4}}"></path>
<path d="M 700 350 C 780 330, 900 330, 1050 340 L 1053 400 C 920 408, 800 410, 720 402 C 680 392, 676 360, 700 350 Z" fill="{{c.b5}}"></path>
</g>

<g clip-path="url(#lm-lake)" opacity="0.55" display="{{zonesDisplay}}" aria-hidden="true">
<rect x="0" y="0" width="1200" height="700" fill="{{c.shallow}}"></rect>
<path d="M 260 330 C 300 280, 400 250, 480 245 C 560 240, 600 255, 660 250 C 740 245, 790 220, 860 228 C 930 236, 980 265, 1060 270 L 1062 460 C 980 470, 920 480, 860 485 C 780 490, 740 515, 660 515 C 590 515, 550 500, 480 505 C 410 510, 360 520, 310 495 C 260 470, 230 390, 260 330 Z" fill="url(#lm-hatch)"></path>
<path d="M 360 330 C 420 290, 520 280, 620 290 C 720 295, 800 260, 900 280 C 960 292, 1010 300, 1060 300 L 1062 430 C 980 445, 900 455, 820 455 C 740 458, 680 480, 600 470 C 520 462, 460 480, 400 460 C 350 440, 330 370, 360 330 Z" fill="{{c.safe}}"></path>
<ellipse cx="660" cy="340" rx="30" ry="13" fill="url(#lm-hatch)"></ellipse>
<ellipse cx="660" cy="340" rx="14" ry="6" fill="{{c.shallow}}"></ellipse>
</g>

<g clip-path="url(#lm-lake)" display="{{uncDisplay}}" aria-hidden="true">
<path d="M 120 300 C 200 250, 300 240, 380 260 C 420 330, 400 420, 380 560 L 100 560 Z" fill="url(#lm-dots)"></path>
<path d="M 600 500 C 700 480, 820 470, 900 480 L 900 560 L 600 560 Z" fill="url(#lm-dots)"></path>
</g>

<g display="{{historyDisplay}}" fill="none" aria-hidden="true">
<path d="M 140 360 C 150 300, 210 260, 280 250 C 340 242, 380 210, 440 200 C 520 188, 560 220, 630 215 C 700 210, 740 180, 810 185 C 880 190, 930 230, 990 240 L 1052 250 L 1060 470 C 1000 480, 950 500, 890 505 C 820 512, 780 540, 710 545 C 640 550, 600 520, 540 525 C 470 530, 430 560, 360 548 C 300 538, 270 500, 220 490 C 170 480, 135 430, 140 360 Z" stroke="{{c.h1}}" stroke-width="2.5" transform="translate(1040 370) scale(0.93 0.9) translate(-1040 -370)"></path>
<path d="M 140 360 C 150 300, 210 260, 280 250 C 340 242, 380 210, 440 200 C 520 188, 560 220, 630 215 C 700 210, 740 180, 810 185 C 880 190, 930 230, 990 240 L 1052 250 L 1060 470 C 1000 480, 950 500, 890 505 C 820 512, 780 540, 710 545 C 640 550, 600 520, 540 525 C 470 530, 430 560, 360 548 C 300 538, 270 500, 220 490 C 170 480, 135 430, 140 360 Z" stroke="{{c.h2}}" stroke-width="4" transform="translate(1040 370) scale(0.82 0.78) translate(-1040 -370)"></path>
<path d="M 140 360 C 150 300, 210 260, 280 250 C 340 242, 380 210, 440 200 C 520 188, 560 220, 630 215 C 700 210, 740 180, 810 185 C 880 190, 930 230, 990 240 L 1052 250 L 1060 470 C 1000 480, 950 500, 890 505 C 820 512, 780 540, 710 545 C 640 550, 600 520, 540 525 C 470 530, 430 560, 360 548 C 300 538, 270 500, 220 490 C 170 480, 135 430, 140 360 Z" stroke="{{c.h3}}" stroke-width="2.5" stroke-dasharray="8 5" transform="translate(1040 370) scale(0.68 0.64) translate(-1040 -370)"></path>
<path d="M 140 360 C 150 300, 210 260, 280 250 C 340 242, 380 210, 440 200 C 520 188, 560 220, 630 215 C 700 210, 740 180, 810 185 C 880 190, 930 230, 990 240 L 1052 250 L 1060 470 C 1000 480, 950 500, 890 505 C 820 512, 780 540, 710 545 C 640 550, 600 520, 540 525 C 470 530, 430 560, 360 548 C 300 538, 270 500, 220 490 C 170 480, 135 430, 140 360 Z" stroke="{{c.h4}}" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" transform="translate(1040 370) scale(0.55 0.5) translate(-1040 -370)"></path>
</g>

<path d="M 140 360 C 150 300, 210 260, 280 250 C 340 242, 380 210, 440 200 C 520 188, 560 220, 630 215 C 700 210, 740 180, 810 185 C 880 190, 930 230, 990 240 L 1052 250 L 1060 470 C 1000 480, 950 500, 890 505 C 820 512, 780 540, 710 545 C 640 550, 600 520, 540 525 C 470 530, 430 560, 360 548 C 300 538, 270 500, 220 490 C 170 480, 135 430, 140 360 Z" fill="none" stroke="{{c.shore}}" stroke-width="1.6"></path>
<line x1="1052" y1="248" x2="1061" y2="472" stroke="{{c.dam}}" stroke-width="7" stroke-linecap="round"></line>

<g font-family="IBM Plex Sans, system-ui, sans-serif" aria-hidden="true">
<text x="1074" y="300" font-size="15" font-weight="600" fill="{{c.label}}">Zapora</text>
<text x="18" y="408" font-size="14" font-style="italic" fill="{{c.riverLabel}}">Nysa Kłodzka</text>
<text x="1092" y="510" font-size="18" font-weight="600" fill="{{c.label}}">Nysa</text>
<text x="470" y="430" font-size="22" font-style="italic" letter-spacing="3" fill="{{c.waterLabel}}">Jezioro Nyskie</text>
</g>

<g display="{{marinasDisplay}}" font-family="IBM Plex Sans, system-ui, sans-serif" aria-hidden="true">
<circle cx="300" cy="250" r="12" fill="{{c.poiBg}}" stroke="{{c.poi}}" stroke-width="2.5"></circle>
<text x="300" y="255" font-size="13" font-weight="700" text-anchor="middle" fill="{{c.poi}}">P</text>
<text x="318" y="236" font-size="13" font-weight="600" fill="{{c.label}}">Przystań</text>
<circle cx="820" cy="186" r="12" fill="{{c.poiBg}}" stroke="{{c.poi}}" stroke-width="2.5"></circle>
<text x="820" y="191" font-size="13" font-weight="700" text-anchor="middle" fill="{{c.poi}}">P</text>
<text x="838" y="172" font-size="13" font-weight="600" fill="{{c.label}}">Przystań</text>
<circle cx="900" cy="505" r="12" fill="{{c.poiBg}}" stroke="{{c.poi}}" stroke-width="2.5"></circle>
<text x="900" y="510" font-size="13" font-weight="700" text-anchor="middle" fill="{{c.poi}}">S</text>
<text x="918" y="534" font-size="13" font-weight="600" fill="{{c.label}}">Slip</text>
</g>

<g display="{{pinDisplay}}" aria-hidden="true">
<circle cx="780" cy="385" r="18" fill="{{c.pin}}" opacity="0.18"></circle>
<circle cx="780" cy="385" r="7.5" fill="{{c.pin}}" stroke="{{c.poiBg}}" stroke-width="3"></circle>
</g>

<rect x="0" y="0" width="1200" height="700" fill="{{c.land}}" opacity="0.55" display="{{dimDisplay}}"></rect>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"zones":{"editor":"boolean","default":true},"bathy":{"editor":"boolean","default":false},"unc":{"editor":"boolean","default":false},"history":{"editor":"boolean","default":false},"marinas":{"editor":"boolean","default":true},"pin":{"editor":"boolean","default":false},"dim":{"editor":"boolean","default":false},"$preview":{"width":1200,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const c = dark ? {
      land: '#151B20', field: '#182027', forest: '#172420', town: '#1C232A', building: '#28313A',
      road: '#2A3540', roadEdge: '#1F2830', river: '#25465A', water: '#1C3441', shore: '#7FA6BB', dam: '#C9D4DC',
      safe: '#34B8B0', risk: '#F2B134', hatch: '#6B4300', shallow: '#D0508A', dots: '#E6EEF3',
      b1: '#2A4C5E', b2: '#24546E', b3: '#1E5F82', b4: '#1A6A97', b5: '#1675AB',
      h1: '#A9D3EE', h2: '#6FB3E0', h3: '#3E8CC4', h4: '#2A6A9E',
      label: '#C9D6DF', riverLabel: '#7FA6BB', waterLabel: '#9CC1D4', poi: '#6FB3E0', poiBg: '#12191F', pin: '#F4F7F9'
    } : {
      land: '#EEF0EA', field: '#E5E9DF', forest: '#DAE4D3', town: '#E4E2DC', building: '#D3D0C8',
      road: '#FFFFFF', roadEdge: '#D6D9D0', river: '#B5D0DE', water: '#CFE1EA', shore: '#5F889C', dam: '#3A4A55',
      safe: '#2BA6A0', risk: '#F2B134', hatch: '#8A5A00', shallow: '#8E1B4F', dots: '#0E2433',
      b1: '#C4DDE9', b2: '#98C3D9', b3: '#6AA4C4', b4: '#3F80AA', b5: '#215C86',
      h1: '#9CC9E4', h2: '#4F97C7', h3: '#2A6FA3', h4: '#143F66',
      label: '#33414A', riverLabel: '#4D7A90', waterLabel: '#3E6A80', poi: '#1C5D8C', poiBg: '#FFFFFF', pin: '#0E2433'
    };
    const d = (v) => (v ? 'inline' : 'none');
    return {
      c,
      zonesDisplay: d(this.props.zones ?? true),
      bathyDisplay: d(this.props.bathy ?? false),
      uncDisplay: d(this.props.unc ?? false),
      historyDisplay: d(this.props.history ?? false),
      marinasDisplay: d(this.props.marinas ?? true),
      pinDisplay: d(this.props.pin ?? false),
      dimDisplay: d(this.props.dim ?? false)
    };
  }
}
</script>
</body>
</html>
